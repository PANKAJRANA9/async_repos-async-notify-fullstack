services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: async-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment: {RABBITMQ_DEFAULT_USER: guest, RABBITMQ_DEFAULT_PASS: guest}
    healthcheck: {test: ["CMD","rabbitmq-diagnostics","-q","ping"], interval: 10s, timeout: 5s, retries: 5}

  redis:
    image: redis:7-alpine
    container_name: async-redis
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 5}

  mysql:
    image: mysql:8.0
    container_name: async-mysql
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: async_notify, MYSQL_USER: async, MYSQL_PASSWORD: async123}
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s}

  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    container_name: async-backend
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/async_notify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: async
      SPRING_DATASOURCE_PASSWORD: async123
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      mysql: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","--spider","-q","http://localhost:8080/api/v1/events/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    container_name: async-frontend
    ports: ["3000:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","--spider","-q","http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: async-prometheus
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:latest
    container_name: async-grafana
    ports: ["3001:3000"]
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin123}
    volumes: ["grafana_data:/var/lib/grafana"]
    depends_on: [prometheus]

volumes:
  mysql_data: {}
  grafana_data: {}
